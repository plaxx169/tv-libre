<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Libre</title>
<link rel="preconnect" href="https://iptv-org.github.io">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<style>
:root{--bg:#12151c;--panel:#1b1f2a;--line:#2b3140;--tx:#eef1f6;--mute:#8d96a8;--hi:#ffc83d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:20px/1.3 system-ui,sans-serif;overflow:hidden}
body{--cols:minmax(360px,38%) 1fr}
#app{display:grid;grid-template-columns:var(--cols);grid-template-rows:auto 1fr;height:100%;padding:1.2vh 1.5vw 0}
header{grid-column:1/3;display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);align-items:center;overflow-x:auto}
#chips{display:contents}
h1{margin:0 14px 0 0;font-size:24px;white-space:nowrap}
button,input{font:inherit;color:var(--tx);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:9px 16px}
button{cursor:pointer;white-space:nowrap}input{min-width:180px}
button:focus,input:focus{outline:none;border-color:var(--hi);box-shadow:0 0 0 3px rgba(255,200,61,.35)}
button.on{background:#2a2f3f;border-color:var(--mute)}
#list{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px}
.ch{display:flex;align-items:center;gap:12px;text-align:left;flex:1;min-width:0}
.ch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ch img{width:44px;height:44px;object-fit:contain;background:#0d0f14;border-radius:6px;flex:none}
.ch small{display:block;color:var(--mute);font-size:15px}
.act{flex:none;padding:9px 14px}
#stage{position:relative;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;background:#000}
#msg{position:absolute;left:20px;bottom:20px;right:20px;background:rgba(0,0,0,.7);padding:10px 16px;border-radius:10px}
#empty{color:var(--mute);padding:20px}
body.full #app{display:block}body.full header,body.full #list{display:none}
body.full #stage{position:fixed;inset:0;z-index:9}
html,body{font-size:var(--fs,20px)}
body.t-cine{--bg:#0e0b1a;--panel:#1a1530;--line:#2f2752;--hi:#ff5d8f;--tx:#f4f0ff;--mute:#9d92c9;--cols:minmax(300px,30%) 1fr}
body.t-cine button:focus{background:#2a2150}body.t-cine .ch img{width:56px;height:56px}
body.t-big{--bg:#000;--panel:#101010;--line:#666;--hi:#ffe600;--tx:#fff;--mute:#d0d0d0;--fs:26px;--cols:minmax(440px,46%) 1fr}
body.t-big button:focus,body.t-big input:focus{border-width:5px}body.t-big .ch img{width:60px;height:60px}
body.t-light{--bg:#f3f4f7;--panel:#fff;--line:#d5d9e2;--tx:#14161c;--mute:#5d6578;--hi:#0b57d0}
body.t-light button.on{background:#dde6fb}body.t-light .ch img{background:#eef0f5}
@media(max-width:800px){body,body[class]{--cols:1fr !important}#app{grid-template-rows:auto 34vh 1fr}header{grid-column:1}#stage{grid-row:2}#list{grid-row:3}}
</style></head><body>
<div id="app">
<header id="bar"><h1>TV Libre</h1><span id="chips"></span></header>
<div id="list"></div>
<div id="stage"><video id="v" autoplay playsinline></video><div id="msg">Cargando…</div></div>
</div>
<script>
const BASE="https://iptv-org.github.io/iptv/languages/spa.m3u";
const T={News:"Noticias",Movies:"Películas",Series:"Series",Kids:"Niños",Sports:"Deportes",Music:"Música",Entertainment:"Entretenimiento",General:"General",Documentary:"Documentales",Animation:"Animación",Culture:"Cultura",Religious:"Religión",Comedy:"Comedia",Undefined:"Otros"};
const $=s=>document.querySelector(s),v=$("#v"),msg=$("#msg"),bar=$("#bar"),list=$("#list");
const get=(k,d)=>{try{const x=JSON.parse(localStorage.getItem(k));return x==null?d:x}catch(e){return d}};
const put=(k,x)=>{try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}};
let chans=get("tvl_cache",[]),fav=get("tvl_fav",[]),bad=get("tvl_bad",{}),view=fav.length?"fav":"all";
let cur=null,hls=null,q="",limit=150,tries=0,timer=null,shown=[];
for(const k in bad)if(Date.now()-bad[k]>2592e5)delete bad[k];
const btn=(cls,txt,fn)=>{const b=document.createElement("button");b.className=cls;b.textContent=txt;b.onclick=fn;return b};
const TH=[["classic","Clásico"],["cine","Cine"],["big","Grande"],["light","Claro"]];let th=get("tvl_th","classic");
const tb=btn("","",()=>{th=TH[(TH.findIndex(x=>x[0]===th)+1)%TH.length][0];put("tvl_th",th);applyTh()});
function applyTh(){if(!TH.some(x=>x[0]===th))th="classic";TH.forEach(([k])=>document.body.classList.toggle("t-"+k,k===th));tb.textContent="Diseño: "+TH.find(x=>x[0]===th)[1]}
bar.insertBefore(tb,$("#chips"));applyTh();
const s=document.createElement("input");s.placeholder="Buscar canal";s.oninput=()=>{q=s.value.toLowerCase();limit=150;render()};bar.appendChild(s);
function parse(t){const out=[],seen=new Set();let m=null;for(const l of t.split(/\r?\n/)){
 if(l.startsWith("#EXTINF")){const c=((l.match(/group-title="([^"]*)"/)||[])[1]||"").split(";")[0].trim();
  m={name:(l.split(",").pop()||"").trim(),logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1]||"",cat:T[c]||c||"Otros"}}
 else if(m&&l&&!l.startsWith("#")){m.url=l.trim();if(!seen.has(m.url)){seen.add(m.url);out.push(m)}m=null}}return out}
function allCats(){const n={};chans.forEach(c=>n[c.cat]=(n[c.cat]||0)+1);return Object.keys(n).sort((x,y)=>n[y]-n[x]).map(k=>[k,n[k]])}
function pinned(){const p=get("tvl_pins",null);return p||allCats().filter(([k,c])=>c>=8&&k!=="Otros").slice(0,5).map(x=>x[0])}
function pick(k){view=k;limit=150;chips();render();first()}
function chips(){const box=$("#chips");box.innerHTML="";const L=[["fav","★ Favoritos"],["all","Todos"],...pinned().map(k=>[k,k])];
 if(view!=="cats"&&!L.some(x=>x[0]===view))L.push([view,view]);
 L.forEach(([k,t])=>box.appendChild(btn(k===view?"on":"",t,()=>pick(k))));
 box.appendChild(btn(view==="cats"?"on":"","Categorías",()=>pick("cats")))}
function renderCats(fk){shown=[];list.innerHTML="";const pins=pinned();
 allCats().forEach(([k,c])=>{const r=document.createElement("div");r.className="row";r.dataset.k=k;
  r.appendChild(btn("ch",k+" ("+c+")",()=>pick(k)));
  r.appendChild(btn("act star",pins.includes(k)?"Fijada ✓":"Fijar",()=>{const p=pinned(),i=p.indexOf(k);if(i>=0)p.splice(i,1);else p.push(k);put("tvl_pins",p);chips();render({k:k,c:"star"})}));
  list.appendChild(r)});
 if(!list.children.length)list.innerHTML='<div id="empty">Cargando categorías…</div>';
 if(fk){const r=[...list.children].find(x=>x.dataset&&x.dataset.k===fk.k),b=r&&r.querySelector("."+fk.c);if(b)b.focus()}}
const isF=c=>fav.some(f=>f.url===c.url);
function toggle(c){const i=fav.findIndex(f=>f.url===c.url);if(i>=0)fav.splice(i,1);else fav.push({name:c.name,logo:c.logo,cat:c.cat,url:c.url});put("tvl_fav",fav)}
function visible(){const a=view==="fav"?fav:chans.filter(c=>(view==="all"||c.cat===view)&&!bad[c.url]);return q?a.filter(c=>c.name.toLowerCase().includes(q)):a}
function chBtn(c){const b=btn("ch","",()=>{cur&&cur.url===c.url?full(true):play(c)});
 const im=new Image();im.loading="lazy";im.onerror=()=>{im.style.visibility="hidden"};if(c.logo)im.src=c.logo;else im.style.visibility="hidden";
 const sp=document.createElement("span");sp.textContent=c.name;const g=document.createElement("small");g.textContent=c.cat||"";sp.appendChild(g);b.append(im,sp);return b}
function mv(i,d){const j=i+d;if(j<0||j>=fav.length)return;[fav[i],fav[j]]=[fav[j],fav[i]];put("tvl_fav",fav);render({k:fav[j].url,c:d<0?"up":"dn"})}
function render(fk){if(view==="cats")return renderCats(fk);shown=visible();list.innerHTML="";
 if(!shown.length){list.innerHTML='<div id="empty">'+(view==="fav"?"Todavía no tenés favoritos. Entrá a “Todos” y elegí ☆ en los canales que quieras.":chans.length?"Sin canales.":"Cargando canales…")+"</div>";return}
 shown.slice(0,limit).forEach((c,i)=>{const r=document.createElement("div");r.className="row";r.dataset.k=c.url;r.appendChild(chBtn(c));
  if(view==="fav"){r.appendChild(btn("act up","↑",()=>mv(i,-1)));r.appendChild(btn("act dn","↓",()=>mv(i,1)));
   r.appendChild(btn("act rm","✕",()=>{fav.splice(i,1);put("tvl_fav",fav);const nb=fav[i]||fav[i-1];render(nb?{k:nb.url,c:"rm"}:null)}))}
  else{const st=btn("act star",isF(c)?"★":"☆",()=>{toggle(c);st.textContent=isF(c)?"★":"☆"});r.appendChild(st)}
  list.appendChild(r)});
 if(shown.length>limit){const r=document.createElement("div");r.className="row";r.appendChild(btn("ch more","Mostrar más ("+(shown.length-limit)+")",()=>{limit+=150;render()}));list.appendChild(r)}
 if(fk){const r=[...list.children].find(x=>x.dataset.k===fk.k),b=r&&r.querySelector("."+fk.c);if(b)b.focus()}}
function first(){const b=list.querySelector(".ch")||bar.querySelector("button.on");if(b)b.focus()}
function play(c){cur=c;put("tvl_last",c);clearTimeout(timer);msg.style.display="block";msg.textContent="Cargando "+c.name+"…";
 if(hls){hls.destroy();hls=null}
 if(window.Hls&&Hls.isSupported()&&/m3u8/i.test(c.url)){
  hls=new Hls({startLevel:0,capLevelToPlayerSize:true,maxBufferLength:12,manifestLoadingTimeOut:8000,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1,fragLoadingMaxRetry:2});
  hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fail()})}
 else v.src=c.url;
 v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})});
 timer=setTimeout(fail,15000)}
v.onplaying=()=>{clearTimeout(timer);tries=0;msg.style.display="none"};
v.onerror=()=>fail();
function fail(){clearTimeout(timer);const c=cur;if(!c)return;if(view!=="fav"){bad[c.url]=Date.now();put("tvl_bad",bad)}
 msg.style.display="block";msg.textContent=c.name+" no responde. Pasando al siguiente…";
 if(tries++<5)setTimeout(()=>{if(cur===c)step(1)},1200)}
function step(d){if(!shown.length)return;const k=shown.findIndex(x=>cur&&x.url===cur.url);play(shown[(k+d+shown.length)%shown.length])}
function full(on){document.body.classList.toggle("full",on);if(!on&&cur){const r=[...list.children].find(x=>x.dataset.k===cur.url);if(r)r.querySelector(".ch").focus()}}
window.handleBack=()=>{if(document.body.classList.contains("full")){full(false);return true}return false};
addEventListener("keydown",e=>{v.muted=false;const a=document.activeElement,K=e.key;
 if(K==="PageUp"||K==="ChannelUp"){step(-1);e.preventDefault();return}
 if(K==="PageDown"||K==="ChannelDown"){step(1);e.preventDefault();return}
 if(K==="MediaPlayPause"){v.paused?v.play():v.pause();e.preventDefault();return}
 if(K==="Escape"||(K==="Backspace"&&a.tagName!=="INPUT")){if(handleBack())e.preventDefault();return}
 if(document.body.classList.contains("full")){if(K==="ArrowUp"){step(-1);e.preventDefault()}else if(K==="ArrowDown"){step(1);e.preventDefault()}else if(K==="Enter"&&cur){msg.style.display="block";msg.textContent=cur.name;setTimeout(()=>{if(!v.paused)msg.style.display="none"},3000)}return}
 if(!/^Arrow/.test(K))return;
 if(bar.contains(a)){if(a.tagName==="INPUT"&&(K==="ArrowLeft"||K==="ArrowRight"))return;
  if(K==="ArrowDown")first();else{const x=[...bar.querySelectorAll("button,input")],k=x.indexOf(a)+(K==="ArrowRight"?1:K==="ArrowLeft"?-1:0);if(x[k])x[k].focus()}
  e.preventDefault();return}
 if(!list.contains(a))return;const r=a.closest(".row");e.preventDefault();if(!r)return;
 if(K==="ArrowLeft"||K==="ArrowRight"){const x=[...r.querySelectorAll("button")],k=x.indexOf(a)+(K==="ArrowRight"?1:-1);if(x[k])x[k].focus()}
 else{const n=K==="ArrowDown"?r.nextElementSibling:r.previousElementSibling,cls=["up","dn","rm","star"].find(c=>a.classList.contains(c))||"ch";
  if(n){(n.querySelector("."+cls)||n.querySelector("button")).focus()}
  else if(K==="ArrowUp"){(bar.querySelector("button.on")||bar.querySelector("button")).focus()}}});
async function refresh(){try{const r=await fetch(BASE);if(!r.ok)throw 0;const n=parse(await r.text());
 if(n.length>20){chans=n;put("tvl_cache",n);chips();if(!list.contains(document.activeElement))render()}}
 catch(e){if(!chans.length)list.innerHTML='<div id="empty">No se pudo cargar la lista. Revisá tu conexión.</div>'}}
chips();render();refresh();
const last=get("tvl_last",null);if(last)play(last);else if(fav.length)play(fav[0]);else msg.textContent="Elegí un canal.";
first();
</script></body></html>
